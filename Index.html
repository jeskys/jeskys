<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Life Sim (HTML)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f8f8f8; }
    h1 { margin-top: 0; }
    #stats { margin-bottom: 15px; }
    .stat-bar { margin: 5px 0; }
    .bar { display: inline-block; height: 12px; background: #4caf50; }
    #log { background: #fff; padding: 10px; border: 1px solid #ccc; height: 200px; overflow-y: auto; margin-bottom: 10px; }
    button { margin: 4px; }
  </style>
</head>
<body>

<h1>Life Sim (HTML Version)</h1>
<div id="stats"></div>
<div id="log"></div>
<div id="choices"></div>
<button id="nextBtn" style="display:none;">Next Year</button>

<script>
class Character {
  constructor(name) {
    this.name = name;
    this.age = 0;
    this.happiness = 50;
    this.health = 50;
    this.smarts = 50;
    this.looks = 50;
    this.money = 0;
    this.alive = true;
    this.traits = [];
  }
}

class Effect {
  constructor({stat=null, delta=0, percent=0, addTrait=null, deathChance=0}) {
    this.stat = stat;
    this.delta = delta;
    this.percent = percent;
    this.addTrait = addTrait;
    this.deathChance = deathChance;
  }
}

class Choice {
  constructor(label, effects=[]) {
    this.label = label;
    this.effects = effects;
  }
}

class Event {
  constructor({id, title, text, minAge=0, maxAge=100, weight=1, choices=[]}) {
    this.id = id; this.title = title; this.text = text;
    this.minAge = minAge; this.maxAge = maxAge;
    this.weight = weight; this.choices = choices;
  }
  eligible(c) { return c.age >= this.minAge && c.age <= this.maxAge; }
}

const events = [
  new Event({
    id: 'toy',
    title: 'First Toy',
    text: 'A relative gifts you a toy. What do you do?',
    minAge: 1, maxAge: 4, weight: 3,
    choices: [
      new Choice('Share it', [new Effect({stat:'happiness', delta:5})]),
      new Choice('Take it apart', [new Effect({stat:'smarts', delta:5})]),
      new Choice('Throw a tantrum', [new Effect({stat:'happiness', delta:-5})]),
    ]
  }),
  new Event({
    id: 'exam',
    title: 'School Exam',
    text: 'You have an important exam.',
    minAge: 6, maxAge: 18, weight: 4,
    choices: [
      new Choice('Study hard', [new Effect({stat:'smarts', delta:7}), new Effect({stat:'happiness', delta:-2})]),
      new Choice('Wing it', [new Effect({stat:'smarts', delta: Math.floor(Math.random()*7)-3})]),
    ]
  }),
  new Event({
    id: 'job',
    title: 'First Job',
    text: 'You see a posting for a barista job.',
    minAge: 16, maxAge: 30, weight: 3,
    choices: [
      new Choice('Apply', [new Effect({stat:'money', delta:500}), new Effect({stat:'happiness', delta:3})]),
      new Choice('Ignore', [new Effect({stat:'happiness', delta:1})]),
    ]
  }),
  new Event({
    id: 'risky',
    title: 'Risky Adventure',
    text: 'Friends invite you to a risky adventure.',
    minAge: 14, maxAge: 40, weight: 1,
    choices: [
      new Choice('Go for it', [new Effect({stat:'happiness', delta:6}), new Effect({deathChance:0.05})]),
      new Choice('Play it safe', [new Effect({stat:'happiness', delta:-1})]),
    ]
  }),
];

let c = new Character(randomName());
let logEl = document.getElementById("log");
let statsEl = document.getElementById("stats");
let choicesEl = document.getElementById("choices");
let nextBtn = document.getElementById("nextBtn");

function randomName() {
  const first = ['Alex','Sam','Riley','Jordan','Taylor','Casey','Avery','Jamie'];
  const last  = ['Lee','Carter','Kim','Rivera','Singh','Patel','Nguyen','Garcia'];
  return first[Math.floor(Math.random()*first.length)]+" "+last[Math.floor(Math.random()*last.length)];
}

function log(msg) {
  logEl.innerHTML += msg + "<br>";
  logEl.scrollTop = logEl.scrollHeight;
}

function showStats() {
  function bar(label, val) {
    return `<div class="stat-bar">${label}: ${val}<div class="bar" style="width:${val}%"></div></div>`;
  }
  statsEl.innerHTML = `
    <strong>${c.name}</strong>, Age ${c.age}<br>
    ${bar("Happiness",c.happiness)}
    ${bar("Health",c.health)}
    ${bar("Smarts",c.smarts)}
    ${bar("Looks",c.looks)}
    Money: $${c.money}
  `;
}

function nextYear() {
  if (!c.alive) return;
  c.age++;
  log(`<b>Age ${c.age}</b>: A new year begins.`);
  // natural health decline
  if (c.age > 60) c.health = Math.max(0, c.health-1);
  // pick event
  const pool = events.filter(e => e.eligible(c));
  if (pool.length === 0) {
    log("Nothing special happens this year.");
    nextBtn.style.display = "inline";
    choicesEl.innerHTML = "";
    showStats();
    return;
  }
  const e = pool[Math.floor(Math.random()*pool.length)];
  log(`<i>${e.title}</i>: ${e.text}`);
  choicesEl.innerHTML = "";
  e.choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.innerText = choice.label;
    btn.onclick = () => { applyChoice(choice); };
    choicesEl.appendChild(btn);
  });
  showStats();
}

function applyChoice(choice) {
  choice.effects.forEach(e => {
    if (e.stat) {
      if (e.percent) {
        if (e.stat==="money") c.money = Math.floor(c.money*(1+e.percent/100));
      } else {
        c[e.stat] = Math.max(0, Math.min(100, c[e.stat]+e.delta));
      }
    }
    if (e.addTrait) c.traits.push(e.addTrait);
    if (e.deathChance && Math.random() < e.deathChance) {
      c.alive = false;
      log("⚠️ A tragic event occurred. You died.");
    }
  });
  choicesEl.innerHTML = "";
  if (c.alive) nextBtn.style.display = "inline";
  else nextBtn.style.display = "none";
  showStats();
}

nextBtn.onclick = () => { nextBtn.style.display="none"; nextYear(); };

log(`You were born. Welcome, ${c.name}!`);
showStats();
nextYear();
</script>

</body>
